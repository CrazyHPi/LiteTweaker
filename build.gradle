plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
    id 'ploceus' version '1.19-SNAPSHOT'
//    id "com.gradleup.shadow" version "9.3.1" // for mixin extra shadowJar
}

//sourceCompatibility = JavaVersion.VERSION_1_8
//targetCompatibility = JavaVersion.VERSION_1_8

base {
    archivesName = project.archives_base_name
}
version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

repositories {
    maven { url = 'https://masa.dy.fi/maven' }
}

//configurations {
//    implementation.extendsFrom shadow
//}

loom {
    runConfigs.configureEach {
        jvmArguments.add("-Dmixin.debug.export=true") // Exports transformed classes for debugging

        programArguments.add("--username=Crazy_H")
        programArguments.addAll("--width=1600", "--height=900")
    }
}

ploceus {
    setIntermediaryGeneration(1)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
//    mappings ploceus.featherMappings(project.feather_build)
    // mcp
    mappings ploceus.mcpMappings("stable", "1.12", "39")

    exceptions ploceus.raven(project.raven_build) // remove this line if not using exceptions patches
    signatures ploceus.sparrow(project.sparrow_build) // remove this line if not using generics patches
//	nests ploceus.nests(project.nests_build) // remove this line if not using inner class patches

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    ploceus.dependOsl(project.osl_version)

    // malilib
    modImplementation "malilib:malilib-ornithe-1.12.2:${project.malilib_version}"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    // shadow jar to include mixin extra for older fabric loader version
//    include(shadow(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixin_extra_version}")))
}

//shadowJar {
//    configurations = [project.configurations.shadow]
//    relocate("com.llamalad7.mixinextras", "carpet.libs.mixinextras")
//    mergeServiceFiles() // Very important!
//}

processResources {
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 8
}

java {
    // Still required by IDEs such as Eclipse and Visual Studio Code
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8


    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
    // If you remove this line, sources will not be generated.
//    withSourcesJar()

    // If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
    // Uncomment this line to generate them.
    // withJavadocJar()
}

// If you plan to use a different file for the license, don't forget to change the file name here!
jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
